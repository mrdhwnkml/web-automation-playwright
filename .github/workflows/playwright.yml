name: Playwright Tests + Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '30 16 * * *' # ⏰ 23:30 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ⚡ Cache npm modules
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      # ⚡ Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      # Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # 🚀 Install Playwright with heartbeat monitor
      - name: Install Playwright browsers
        run: |
          echo "START: $(date)"

          (while true; do echo "⏳ still downloading... $(date)"; sleep 20; done) &
          HB=$!

          npx playwright install chromium

          kill $HB
          echo "DONE: $(date)"

      # Run tests
      - name: Run Playwright tests
        run: npm run tests | tee test-log.txt

      # Upload log
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-log.txt

      # AI Analyzer
      - name: Run AI Test Analyzer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node ai-analyzer.js

      # Clean Allure
      - name: Clean old Allure report
        if: always()
        run: rm -rf allure-report

      # Generate Allure report
      - name: Install Allure CLI & Generate Report
        if: always()
        run: |
          ALLURE_VERSION=2.27.0

          wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -q -o allure-${ALLURE_VERSION}.zip -d $HOME/.allure
          chmod +x $HOME/.allure/allure-${ALLURE_VERSION}/bin/allure

          export PATH=$HOME/.allure/allure-${ALLURE_VERSION}/bin:$PATH

          allure generate allure-results --clean -o allure-report

      # Deploy Pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          force_orphan: true
          allow_empty_commit: true
          commit_message: "Update Allure report $(date +'%Y-%m-%d %H:%M:%S')"

      # Upload Playwright report
      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30