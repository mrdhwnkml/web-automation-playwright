name: Playwright Tests + Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
     # ⏰ Scheduler: 23:30 WIB (16:30 UTC)
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      # ⚡ CACHE PLAYWRIGHT BROWSERS (INI YANG PALING PENTING)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
          restore-keys: |
            playwright-${{ runner.os }}-chromium-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright package 
        run: |
          npm list @playwright/test
          npx playwright --version

      - name: Check disk
        run: |
          df -h
          free -h
          
      - name: Check unzip
        run: |
          unzip -v  

      - name: Check Playwright version
        run: |
          npm list @playwright/test
          npx playwright --version

          echo "=== PLAYWRIGHT CACHE ==="
          ls -lah ~/.cache/ms-playwright || true

          echo "=== BROWSER SIZE ==="
          du -sh ~/.cache/ms-playwright || true

      - name: Debug npm
        run: |
          pwd
          ls -la
          npm list @playwright/test

      - name: Install Playwright browsers
        env:
          DEBUG: pw:install
        run: |
          echo "START $(date)"
          npx playwright install chromium
          echo "INSTALL DONE $(date)"

      - name: Check Browser Folder
        run: |
          echo "HOME=$HOME"
          find ~/.cache -maxdepth 3 -type d | sort | head -100

      - name: Run Playwright tests
        run: npm run tests | tee test-log.txt
      
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
            name: test-log
            path: test-log.txt
      
      - name: Run AI Test Analyzer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node ai-analyzer.js

      - name: Clean old Allure report
        if: always()
        run: rm -rf allure-report
        
      - name: Install Allure CLI & Generate Report
        if: always()
        run: |
          # 1️⃣ Install Allure CLI resmi
          ALLURE_VERSION=2.27.0
          wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -q -o allure-${ALLURE_VERSION}.zip -d $HOME/.allure
          chmod +x $HOME/.allure/allure-${ALLURE_VERSION}/bin/allure

          # 2️⃣ Tambahkan ke PATH di session ini
          export PATH=$HOME/.allure/allure-${ALLURE_VERSION}/bin:$PATH

          # 3️⃣ Generate report
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          force_orphan: true
          allow_empty_commit: true
          commit_message: "Update Allure report $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
